name: Build Jeebli APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get


      - name: Build APK
        run: flutter build apk --release

      - name: Delete old release if exists
        run: |
          gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "جيب لي - آخر إصدار"
          body: |
            ## تحديث 🚀
            - واجهة لوحة تحكم صاحب المطعم محسّنة
            - إصلاح عرض صور المنتجات من جميع المصادر
            - نظام عروض ترويجية جماعية للسوبر أدمن
            - صوت إشعارات مخصص وحصري لجيبلي
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
