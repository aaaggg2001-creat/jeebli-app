name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: 🔑 Print SHA Fingerprints (for Firebase Console)
        run: |
          echo "======================================"
          echo "🔑 SHA Fingerprints من الـ Debug Keystore:"
          echo "======================================"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>/dev/null | grep -E "SHA1:|SHA256:"
          echo "======================================"
          echo "✅ انسخ الـ SHA1 والـ SHA256 وأضفهما في Firebase Console"
          echo "======================================"

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Jeebli-App.apk

      - name: Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: "Jeebli App - آخر إصدار 🛵"
          body: |
            ## 📦 أحدث نسخة من تطبيق جيبلي

            ### كيفية التثبيت:
            1. قم بتحميل ملف `Jeebli-App.apk` أدناه
            2. افتح الملف على هاتفك الأندرويد
            3. اضغط "تثبيت" وامنح الأذونات المطلوبة

            > 📝 آخر تحديث: ${{ github.event.head_commit.message }}
          artifacts: "build/app/outputs/flutter-apk/Jeebli-App.apk"
          allowUpdates: true
          makeLatest: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
