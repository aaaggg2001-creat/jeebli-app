name: Build and Release APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Get version
        id: version
        run: echo "VERSION=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.VERSION }}
          name: "Jeebli App ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📦 نسخة جديدة من تطبيق جيبلي
            
            ### كيفية التثبيت:
            1. قم بتحميل ملف `app-release.apk` أدناه
            2. افتح الملف على هاتفك الأندرويد
            3. اضغط "تثبيت" وامنح الأذونات المطلوبة
          artifacts: "build/app/outputs/flutter-apk/app-release.apk"
          artifactName: "Jeebli-App.apk"
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
