name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Get version
        id: version
        run: echo "version=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "جيبلي ديلفري - نسخة ${{ steps.version.outputs.version }}"
          body: |
            ## ✅ نسخة جديدة من تطبيق جيبلي ديلفري
            
            ### كيفية التثبيت:
            1. حمّل ملف `jeebli-release.apk` من الأسفل.
            2. افتح الملف على هاتفك الأندرويد وثبّته.
            3. تمتع بالتطبيق! 🚀
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: jeebli-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
